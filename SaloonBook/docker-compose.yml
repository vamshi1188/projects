# Frontend-only application
# This docker-compose file serves the static frontend build
services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/web/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

# To use:
# 1. Build the frontend: cd frontend/web && npm run build
# 2. Start the container: docker compose up -d
# 3. Access at http://localhost:8080
